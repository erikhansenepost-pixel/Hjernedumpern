[project]
name = "transkribering"
version = "0.3.0"
description = "Lokal CLI som transkriberer norsk lyd med NB-Whisper (MLX default, faster-whisper fallback)."
requires-python = ">=3.11"
dependencies = [
    "mlx-whisper>=0.4",
    "faster-whisper>=1.2",
]

[project.scripts]
transkriber = "transkribér:main"
